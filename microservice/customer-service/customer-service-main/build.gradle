plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}
dependencyManagement {
    dependencies {
        dependency 'com.google.protobuf:protobuf-java:4.36.2'
    }
}

dependencies {
    implementation 'kh.edu.istad:istad-common-swagger'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Customer-service local modules
    implementation project(':customer-service-domain:customer-domain-core')
    implementation project(':customer-service-domain:customer-application-service')
    implementation project(':customer-service-message')
    implementation project(':customer-service-persistence')
    implementation project(':customer-service-restapi')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    // gRPC
    implementation 'kh.edu.istad:istad-common-grpc:1.0.0'
    implementation 'io.grpc:grpc-netty-shaded:1.83.1'

    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'org.postgresql:postgresql'
}