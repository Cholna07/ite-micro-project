server:
  port: 9090

spring:
  application:
    name: customer-service
  mongodb:
    host: localhost
    port: 2026
    username: mongod
    password: mongod
    authentication-database: admin
    database: db_customer
    uuid-representation: standard
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:9090/eureka/

