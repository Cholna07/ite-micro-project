server:
  port: 9091

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/customer_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    consul:
      discovery:
        service-name: customer-service
        prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
