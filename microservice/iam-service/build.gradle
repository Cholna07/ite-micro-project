plugins {
    id 'java'
}

group = 'kh.edu.istad'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Spring MVC resolves implicit @RequestParam/@PathVariable names from Java
// reflection metadata. Keep that metadata in every module's compiled classes.
allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
    }
}

test {
    useJUnitPlatform()
}
