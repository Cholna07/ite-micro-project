plugins {
    id 'spring-boot-common-conventions'
    id 'org.springframework.boot'
}

group = 'kh.edu.istad'
version = '1.0.0'

dependencies {
    // Domain
    implementation project(':iam-domain:iam-domain-core')
    implementation project(':iam-domain:iam-application-service')

    // Other modules
    implementation project(':iam-persistence')
    implementation project(':iam-infrastructure')
    implementation project(':iam-rest-api')
    implementation project(':iam-web')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
