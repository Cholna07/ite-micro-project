iam:
  security:
    jwt:
      issuer: cholna-iam
      secret: ${IAM_JWT_SECRET}
      access-token-expiration: 15m
spring:
  application:
    name: iam-service

  datasource:
    url: jdbc:postgresql://localhost:5432/iam_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
