iam:
  security:
    jwt:
      issuer: cholna-iam
      secret: ${IAM_JWT_SECRET:local-development-only-change-me-32-bytes-minimum}
      access-token-expiration: 15m

  oauth2:
    registration:
      client-id: ${IAM_REGISTRATION_CLIENT_ID:local-registration-client}
      client-secret: ${IAM_REGISTRATION_CLIENT_SECRET:local-registration-secret}

spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  application:
    name: iam-service

  datasource:
    url: jdbc:postgresql://localhost:5432/iam_db
    username: postgres
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          facebook:
            provider: facebook
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - public_profile
              - email

          telegram:
            client-name: Telegram
            client-id: ${TELEGRAM_CLIENT_ID}
            client-secret: ${TELEGRAM_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile

        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v26.0/dialog/oauth
            token-uri: https://graph.facebook.com/v26.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v26.0/me?fields=id,name,email,picture
            user-name-attribute: id

          telegram:
            issuer-uri: https://oauth.telegram.org

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.client: TRACE
    org.springframework.security.oauth2.core: DEBUG
    org.springframework.security.oauth2.client.web.HttpSessionOAuth2AuthorizationRequestRepository: TRACE

server:
  # Keep IAM separate from the other local services; override with IAM_SERVER_PORT when needed.
  port: ${IAM_SERVER_PORT:9191}
