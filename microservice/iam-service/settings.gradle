pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(
                    files("../../gradle/libs.versions.toml")
            )
        }
    }
}
rootProject.name = 'iam-service'

include'iam-main'
include'iam-domain'
include 'iam-domain:iam-domain-core'
include 'iam-domain:iam-application-service'
include 'iam-rest-api'
include 'iam-persistence'
include 'iam-web'
include 'iam-infrastructure'